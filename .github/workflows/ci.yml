name: CI

# CI runs on the PR ONLY -- the gate that is actually checked. Three reasons the
# post-merge `push: [main]` run was removed rather than kept as a backstop:
#   1. `pull_request` already builds refs/pull/N/merge, so a main-push run re-tests
#      a tree byte-identical to what the PR just proved.
#   2. main carries no branch protection, so no required check depended on it.
#   3. .githooks/pre-push runs everything below PLUS the acceptance lane, locally,
#      before anything reaches GitHub. CI is a clean-machine second opinion, not
#      the first line.
# Measured before the change: sprint-044 burned 7 runs (6 PR + 1 main push) at
# ~12 billed minutes each, and 5 of the 6 PR runs were testing superseded commits.
# TRADE-OFF ACCEPTED: a direct push to main now gets no CI. The pre-push hook covers
# it from a hooked clone; a push from an unhooked clone would be unverified.
on:
  pull_request:
    branches: [main]
    # Mirrors the docs-only short-circuit in .githooks/pre-push:254 so the two
    # gates cannot disagree about what counts as a docs-only change.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'memory/**'

# Supersede in-flight runs for the same ref: pushing again to an open PR should
# cancel the run testing the commit you just replaced, not race it to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Shared scripts, so this job cannot drift from the git hooks.
      # Python stays in the lint-python job below — this runner has no uv.
      #
      # lint:ts brings the mobile typecheck to CI for the first time, but only
      # PARTLY: apps/mobile/tsconfig.json includes .expo/types/**/*.ts and
      # expo-env.d.ts, both gitignored and produced only by a running Expo dev
      # server (init-worktree.sh regenerates them locally). Without them
      # typed-route errors compile clean, so CI reports a mobile typecheck it
      # does not fully perform. Concern 5c9d504cd504.
      - run: bun run lint:ts
      - run: bun run lint:e2e

  test-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divineruin
          POSTGRES_PASSWORD: divineruin_dev
          POSTGRES_DB: divineruin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U divineruin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://divineruin:divineruin_dev@localhost:55432/divineruin
      REDIS_URL: redis://localhost:56379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: bun install
      - run: bun run scripts/migrate.ts
      - run: cd scripts && uv sync && uv run python seed_content.py
      # test:server isolates db.test.ts (real lazy SQL Proxy) from the bulk
      # suite, which mock.module()s ./db.ts (Bun module mocks leak across files).
      - run: bun run test:server
      - run: bun test --cwd apps/mobile
      - run: bun test --cwd packages/shared
      - run: bun test --cwd apps/web

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: cd apps/agent && uv sync
      - run: cd apps/agent && uv run ruff check .
      - run: cd apps/agent && uv run ruff format --check .
      - run: cd apps/agent && uv run pyright

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pytest tests/` runs the full tree. The acceptance lane self-provisions
    # per-run testcontainers, but the fast-lane real-PG tests connect to the
    # shared dev DB at :55432 (conftest's ensure_db_up()); provide it here as a
    # migrated service so those round-trip tests find their tables. Mirrors
    # test-bun / test-e2e.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divineruin
          POSTGRES_PASSWORD: divineruin_dev
          POSTGRES_DB: divineruin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U divineruin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://divineruin:divineruin_dev@localhost:55432/divineruin
      REDIS_URL: redis://localhost:56379
    steps:
      - uses: actions/checkout@v4
      # bun is required: the cross-language acceptance tests (_server.py) spawn
      # `bun src/index.ts` against the Python lane's migrated testcontainer to
      # exercise the TS↔Python seam over real HTTP. Without it they error with
      # FileNotFoundError: 'bun'. Mirrors the test-bun / test-e2e setup.
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install
      - run: bun run scripts/migrate.ts
      - run: cd scripts && uv sync && uv run python seed_content.py
      - run: cd apps/agent && uv sync
      - run: cd apps/agent && uv run pytest tests/ -q

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divineruin
          POSTGRES_PASSWORD: divineruin_dev
          POSTGRES_DB: divineruin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U divineruin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://divineruin:divineruin_dev@localhost:55432/divineruin
      REDIS_URL: redis://localhost:56379
      JWT_SECRET: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      INTERNAL_SECRET: e2e-test-internal-secret
      NODE_ENV: development
      EXPO_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v7
      - run: bun install
      - run: bun run scripts/migrate.ts
      - run: cd scripts && uv sync && uv run python seed_content.py
      - run: cd e2e && bun install
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: cd e2e && bunx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
