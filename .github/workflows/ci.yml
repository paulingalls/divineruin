name: CI

# PR CI runs full static checks in two lint jobs. Local Proof selections own
# behavioral coverage: land at story land, sprint at sprint close, and both
# on each free patch's trial-merged tree. The scheduled super run proves fresh.
on:
  pull_request:
    branches: [develop, main]
    # Documentation-only PRs do not need the lint jobs.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "memory/**"

# Supersede in-flight runs for the same ref: pushing again to an open PR should
# cancel the run testing the commit you just replaced, not race it to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOW_PAID_TESTS: ""
  REQUIRE_REAL_LLM: ""

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun install --cwd e2e --frozen-lockfile
      # lint:ts typechecks apps/mobile, whose tsconfig includes the gitignored
      # generated types. This runs the same guarded generator verify:upgrade uses,
      # which fails when router.d.ts comes back missing, empty or a directory --
      # without it typed-route errors compile clean and CI reports a mobile
      # typecheck it does not perform.
      - run: bun run --cwd apps/mobile generate:route-types
      - run: bun run lint:ts
      - run: bun run lint:e2e

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.13.7
          python-version: 3.14.7
      - run: uv sync --project apps/agent --frozen
      - run: cd apps/agent && uv run ruff check .
      - run: cd apps/agent && uv run ruff format --check .
      - run: cd apps/agent && uv run pyright
