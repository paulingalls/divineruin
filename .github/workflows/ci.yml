name: CI

# CI runs on the PR ONLY -- the gate that is actually checked. Three reasons the
# post-merge `push: [main]` run was removed rather than kept as a backstop:
#   1. `pull_request` already builds refs/pull/N/merge, so a main-push run re-tests
#      a tree byte-identical to what the PR just proved.
#   2. main carries no branch protection, so no required check depended on it.
#   3. .githooks/pre-push runs everything below PLUS the acceptance lane, locally,
#      before anything reaches GitHub. CI is a clean-machine second opinion, not
#      the first line.
# Measured before the change: sprint-044 burned 7 runs (6 PR + 1 main push) at
# ~12 billed minutes each, and 5 of the 6 PR runs were testing superseded commits.
# TRADE-OFF ACCEPTED: a direct push to main now gets no CI. The pre-push hook covers
# it from a hooked clone; a push from an unhooked clone would be unverified.
on:
  pull_request:
    branches: [main]
    # Mirrors the docs-only short-circuit in .githooks/pre-push:254 so the two
    # gates cannot disagree about what counts as a docs-only change.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'memory/**'

# Supersede in-flight runs for the same ref: pushing again to an open PR should
# cancel the run testing the commit you just replaced, not race it to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd e2e --frozen-lockfile
      # lint:ts typechecks apps/mobile, whose tsconfig includes the gitignored
      # generated types. This runs the same guarded generator verify:upgrade uses,
      # which fails when router.d.ts comes back missing, empty or a directory --
      # without it typed-route errors compile clean and CI reports a mobile
      # typecheck it does not perform.
      - run: bun run --cwd apps/mobile generate:route-types
      - run: bun run lint:ts
      - run: bun run lint:e2e

  test-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divineruin
          POSTGRES_PASSWORD: divineruin_dev
          POSTGRES_DB: divineruin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U divineruin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DIVINERUIN_CI_SERVICE_DB: "1"
      DATABASE_URL: postgresql://divineruin:divineruin_dev@127.0.0.1:55432/divineruin
      REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.6
          python-version: 3.14.7
      - run: bun install --frozen-lockfile
      - run: bun run scripts/migrate.ts
      - run: uv sync --project scripts --frozen && bun run seed
      # test:server isolates db.test.ts (real lazy SQL Proxy) from the bulk
      # suite, which mock.module()s ./db.ts (Bun module mocks leak across files).
      - run: bun run test:server
      - run: bun test --cwd apps/mobile
      - run: bun test --cwd packages/shared
      - run: bun test --cwd packages/design-tokens
      - run: bun install --cwd e2e --frozen-lockfile
      - run: bun test e2e/require-environment.test.ts
      - run: bun test e2e/ports.test.ts
      - run: bun --env-file=.env test ./scripts
      - run: bun test --cwd apps/web

  lint-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.6
          python-version: 3.14.7
      - run: uv sync --project apps/agent --frozen
      - run: cd apps/agent && uv run ruff check .
      - run: cd apps/agent && uv run ruff format --check .
      - run: cd apps/agent && uv run pyright

  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pytest tests/` runs the full tree. The acceptance lane self-provisions
    # per-run testcontainers, but the fast-lane real-PG tests connect to the
    # shared dev DB at :55432 (conftest's ensure_db_up()); provide it here as a
    # migrated service so those round-trip tests find their tables. Mirrors
    # test-bun / test-e2e.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divineruin
          POSTGRES_PASSWORD: divineruin_dev
          POSTGRES_DB: divineruin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U divineruin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DIVINERUIN_CI_SERVICE_DB: "1"
      DATABASE_URL: postgresql://divineruin:divineruin_dev@127.0.0.1:55432/divineruin
      REDIS_URL: redis://127.0.0.1:56379
      # Paid tests (live_voice included) are skipped regardless of this key: CI never sets
      # ALLOW_PAID_TESTS (apps/agent/tests/_paid_tests.py, human 2026-09-22).
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      # bun is required: the cross-language acceptance tests (_server.py) spawn
      # `bun src/index.ts` against the Python lane's migrated testcontainer to
      # exercise the TS↔Python seam over real HTTP. Without it they error with
      # FileNotFoundError: 'bun'. Mirrors the test-bun / test-e2e setup.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.6
          python-version: 3.14.7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run scripts/migrate.ts
      - run: uv sync --project scripts --frozen && bun run seed
      - run: uv sync --project apps/agent --frozen
      - run: bun install --cwd e2e --frozen-lockfile
      - run: cd apps/agent && uv run pytest tests/ -q

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: divineruin
          POSTGRES_PASSWORD: divineruin_dev
          POSTGRES_DB: divineruin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U divineruin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DIVINERUIN_CI_SERVICE_DB: "1"
      DATABASE_URL: postgresql://divineruin:divineruin_dev@127.0.0.1:55432/divineruin
      REDIS_URL: redis://127.0.0.1:56379
      JWT_SECRET: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
      INTERNAL_SECRET: e2e-test-internal-secret
      NODE_ENV: development
      EXPO_PUBLIC_API_URL: http://localhost:3001
      E2E_API_PORT: "3001"
      E2E_APP_PORT: "8082"
      E2E_WEB_PORT: "8085"
      E2E_LH_DEBUG_PORT: "9222"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.6
          python-version: 3.14.7
      - run: bun install --frozen-lockfile
      - run: bun run scripts/migrate.ts
      - run: uv sync --project scripts --frozen && bun run seed
      - run: bun install --cwd e2e --frozen-lockfile
      - run: cd e2e && bunx playwright install --with-deps chromium
      - run: cd e2e && bunx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !env.ACT }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
