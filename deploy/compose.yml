x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    logging: *logging
    build:
      context: ..
      dockerfile: deploy/migrate.Dockerfile
    env_file:
      - ${DEPLOY_ENV_FILE:?supply an operator env file}
    environment:
      SEED_PRODUCTION: "1"
    restart: "no"
  server:
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    env_file:
      - ${DEPLOY_ENV_FILE:?supply an operator env file}
    environment:
      MEDIA_DIR: /var/lib/divineruin/media
    volumes:
      - media:/var/lib/divineruin/media
    ports:
      - "127.0.0.1:${DEPLOY_HTTP_PORT:-3001}:3001"
  agent: &agent
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: ${COMPOSE_PROJECT_NAME:-divineruin}-agent
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
      platforms:
        - linux/amd64
    env_file:
      - ${DEPLOY_ENV_FILE:?supply an operator env file}
    environment:
      MEDIA_DIR: /var/lib/divineruin/media
      AGENT_ENV: production
      SERVER_URL: http://server:3001
    volumes:
      - media:/var/lib/divineruin/media
  worker:
    <<: *agent
    command: ["python", "async_worker.py"]

volumes:
  media:
