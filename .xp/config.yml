# xp project config (xp-plugin 1.0.0)
trunk: develop       # sprints and free patches land here; main is what is live (scripts/promote-main.sh)
versioning: notes    # branches add changes/<branch>.md; xp.py release stamp versions develop after merge
version_files: package.json  # comma-separated JSON manifests
worktree_setup: bash scripts/init-worktree.sh   # new story/free worktree, before agents
worktree_teardown: bash scripts/teardown-worktree.sh   # before removal; red warns, removes anyway
debt_budget: 0.2     # max share of sprint stories that are scheduled debt
codex_sandbox: danger-full-access  # Codex only: workspace-write | danger-full-access
#                    # This posture governs all Codex roles.
#                    # teammates run uv/pytest/bun/git AND a per-worktree docker stack
#                    # (scripts/init-worktree.sh); workspace-write blocks the testcontainer lanes
#                    # by denying ALL outbound network — DNS, loopback, the docker socket.

roles:               # harness/model[/effort]; a card's Executor: line overrides
  # THE DIVERSITY ARGUMENT: a reviewer sharing the implementer's priors agrees with them for
  # the same reasons, so each leg that argues with work sits in the other family from the
  # leg that wrote it.
  # Executor, fixer and slate-reviewer run GPT-6.2 Sol (trials: patron-fate-and-facts v0.50.0 and
  # patron-combat-edges v0.51.0: honest handbacks, 6.1-level cost, every fix shown red then green).
  # The planner stays on GPT-6.1 Sol (a reported 6.2 codebase-Q&A regression; no trial yet).
  # Astra cost ~6-7x Sol on these seats (10x on cached
  # input, which dominates) and was 77% of a sprint's codex spend at 21% of its tokens.
  # Effort buys back judgment where a miss is silent: planner and angle-reviewer at high.
  # Medium elsewhere; low effort on executor/fixer cuts corners that surface only at land.
  # Terra loses on long multi-step coding (needs xhigh to near Sol, then costs more).
  lead: claude/claude-opus-5-5
  planner: codex/gpt-6.1-sol/high
  executor: codex/gpt-6.2-sol/medium
  # claude, so the story diff review is the cross-family look at a codex executor.
  reviewer: claude/claude-opus-5-5/medium
  # /high: a plan review is cheap relative to a story built on a plan nobody argued with.
  plan-reviewer: claude/claude-opus-5-5/high
  # codex: the lead authors the slate on claude.
  slate-reviewer: codex/gpt-6.2-sol/medium
  # claude: in the patron-combat-edges side-by-side (same range), Opus found 5 real issues and
  # GPT 6.1 found 1, with no overlap (human 2026-11-18). The code it reviews is written by codex,
  # so it stays cross-family. It reads the whole sprint diff; the fixer reads the findings.
  angle-reviewer: claude/claude-opus-5-5/high
  fixer: codex/gpt-6.2-sol/medium
  # Security angle only (sprint.py runs it when angle.stem == "security"). An exact CLEAR
  # skips the security angle-reviewer, so read its reasons before trusting them: Haiku
  # flipped CLEAR/ESCALATE across runs in xp-plugin's replay. On a miss, unset for one sprint.
  angle-triage: claude/claude-haiku-5-5
