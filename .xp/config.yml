# xp project config (xp-plugin 1.0.0)
versioning: on       # each release is tagged; the tag must match version_files
version_files: package.json  # comma-separated JSON manifests
worktree_setup: bash scripts/init-worktree.sh   # new story/free worktree, before agents
worktree_teardown: bash scripts/teardown-worktree.sh   # before removal; red warns, removes anyway
debt_budget: 0.2     # max share of sprint stories that are scheduled debt
codex_sandbox: danger-full-access  # Codex only: workspace-write | danger-full-access
#                    # This posture governs all Codex roles.
#                    # teammates run uv/pytest/bun/git AND a per-worktree docker stack
#                    # (scripts/init-worktree.sh); workspace-write blocks the testcontainer lanes
#                    # by denying ALL outbound network — DNS, loopback, the docker socket.

roles:               # harness/model[/effort]; a card's Executor: line overrides
  # THE DIVERSITY ARGUMENT: a reviewer sharing the implementer's priors agrees with them for
  # the same reasons, so each leg that argues with work sits in the other family from the
  # leg that wrote it.
  # Model split: the judgment seats (planner, slate-reviewer, angle-reviewer) run on codex's
  # frontier model; the long multi-step seats (executor, fixer) stay on the cheaper workhorse
  # at medium, because low effort there cuts corners that surface only at land.
  lead: claude/claude-opus-5-5
  planner: codex/gpt-6-astra/medium
  executor: codex/gpt-6.1-sol/medium
  # claude, so the story diff review is the cross-family look at a codex executor.
  reviewer: claude/claude-opus-5-5/medium
  # /high: a plan review is cheap relative to a story built on a plan nobody argued with.
  plan-reviewer: claude/claude-opus-5-5/high
  # codex: the lead authors the slate on claude.
  slate-reviewer: codex/gpt-6-astra/medium
  # Both read the whole sprint diff; codex's input limit is 1,048,576 characters. If either
  # dies on input size, that limit is the first suspect.
  angle-reviewer: codex/gpt-6-astra/medium
  fixer: codex/gpt-6.1-sol/medium
