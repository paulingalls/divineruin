appId: com.divineruin.app
---
# Clear state without launching, then let the link cold-start the app.
# On Android the Expo dev launcher drops a link that arrives while it is
# still starting, leaving it on its server list instead of the app.
- clearState
- openLink: ${APP_LAUNCH_URL}
# Wait out the first bundle load (slow on Intel emulators) so the tap
# reaches the dev-menu tutorial instead of timing out before it appears.
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# Expo's first-run tutorial opens the developer menu after Continue.
- swipe:
    start: 50%,20%
    end: 50%,90%
    duration: 400
- extendedWaitUntil:
    visible: "Listen to the dark"
    timeout: 30000
