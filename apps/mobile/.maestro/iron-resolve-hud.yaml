appId: com.divineruin.app
---
- openLink: ${APP_LAUNCH_URL}
- tapOn:
    text: "Continue"
    optional: true
- openLink: ${ROUTE_URL}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Combat update 0"
    timeout: 50000
- assertVisible:
    id: "persistent-temp-hp"
    text: "[+]7 TEMP HP"
- tapOn: "Next combat update"
- assertVisible: "Combat update 1"
- assertVisible: "Kael"
- assertVisible: "Iron Resolve"
- assertVisible:
    id: "persistent-temp-hp"
    text: "[+]4 TEMP HP"
- assertVisible:
    id: "combatant-temp-hp"
    text: "[+]4 TEMP HP"
- tapOn: "Next combat update"
- assertVisible: "Combat update 2"
- assertVisible: "Kael"
- assertNotVisible: "Iron Resolve"
- assertNotVisible:
    id: "persistent-temp-hp"
- assertNotVisible:
    id: "combatant-temp-hp"
