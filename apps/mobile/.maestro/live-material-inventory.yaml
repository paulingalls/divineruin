appId: com.divineruin.app
---
- openLink: ${APP_LAUNCH_URL}
- tapOn:
    text: "Continue"
    optional: true
- openLink: ${ROUTE_URL}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Inventory step 0"
    timeout: 50000
- assertVisible: ${RUN_ID_TEXT}
- assertVisible: "Oak Wood, 2"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 1"
- assertVisible: "Oak Wood, 2"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 2"
- assertVisible: "Oak Wood, 2"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 3"
- assertVisible: "Oak Wood, 2"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 4"
- assertVisible: "Oak Wood"
- assertNotVisible: "Oak Wood, 2"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 5"
- assertVisible: "No items"
- assertNotVisible: "Oak Wood"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 6"
- assertVisible: "Wolf Pelt"
- tapOn: "Next committed action"
- assertVisible: "Inventory step 7"
- assertVisible: "Wolf Pelt"
- assertVisible: "Crystal Flask"
- takeScreenshot: inventory
