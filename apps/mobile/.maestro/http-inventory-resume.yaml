- assertVisible: "Oak Wood, tainted, 1"
- tapOn: "Oak Wood, tainted, 1"
- assertVisible: "Tainted quantity 1"
- tapOn: "← Back"
- tapOn: "Oak Wood, clean, 4"
- assertVisible: "Clean quantity 4"
- tapOn: "← Back"
- takeScreenshot: http-inventory
