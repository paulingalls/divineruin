appId: com.divineruin.app
---
- openLink: ${APP_LAUNCH_URL}
- tapOn:
    text: "Continue"
    optional: true
- openLink: ${ROUTE_URL}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "HTTP quantity 2"
    timeout: 50000
- assertVisible: "Oak Wood, clean, 2"
- assertVisible: "Oak Wood, tainted, 1"
- tapOn: "Oak Wood, tainted, 1"
- assertVisible: "Tainted quantity 1"
- tapOn: "← Back"
- tapOn: "Oak Wood, clean, 2"
- assertVisible: "Clean quantity 2"
- tapOn: "← Back"
- pressKey: Home
