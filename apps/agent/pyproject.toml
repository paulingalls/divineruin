[project]
name = "divineruin-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents~=1.8.2",
    "livekit-plugins-anthropic~=1.8.2",
    "livekit-plugins-deepgram~=1.8.2",
    "livekit-plugins-inworld~=1.8.2",
    "livekit-plugins-openai~=1.8.2",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",
    # livekit-plugins-anthropic 1.8.2 requires anthropic>=0.41,<1.
    "anthropic>=0.125.0,<1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "docker>=7.2.0",
    "pillow>=12.3.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "acceptance: requires Docker (livekit dev-server testcontainer)",
    "real_llm: reaches the Anthropic API; fails loud without a key when REQUIRE_REAL_LLM=1",
    "openai_real_llm: reaches the OpenAI API; fails loud without a key when REQUIRE_REAL_LLM=1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "UP007",   # X | Y union syntax (keep Optional for clarity)
    "SIM117",  # multiple-with statements — common in test mocking
    "SIM105",  # contextlib.suppress — style preference
    "RUF001",  # ambiguous unicode — intentional punctuation matching
    "RUF012",  # mutable class defaults — fine for test fixtures
]

[tool.ruff.lint.isort]
known-first-party = ["db", "tools", "prompts", "voices", "session_data", "affect_analyzer", "game_events", "rules_engine", "dialogue_parser", "latency", "background_process", "db_errors", "async_rules", "async_worker", "narration", "tts_prerender", "tts_pauses", "activity_templates", "creation_data", "creation_rules", "creation_prompts", "creation_tools", "card_tap_handler", "session_summary"]
