version: 1
project: "divineruin"
delivered:
  - "**"
coverage:
  - "{scripts,packages/shared,packages/design-tokens,apps/server,apps/mobile,apps/web}/**/*.test.{ts,tsx}"
inputs:
  bun-config:
    - "bun.lock"
    - "package.json"
    - "bunfig.toml"
    - "tsconfig.json"
  seeded-data:
    - "content/*.json"
    - "scripts/migrations/**"
    - "scripts/pyproject.toml"
    - "scripts/uv.lock"
    - ".python-version"
    - "scripts/.python-version"
    - "apps/agent/_gods_content.py"
    - "apps/agent/action_contracts.py"
    - "apps/agent/archetypes.py"
    - "apps/agent/catalog_parse.py"
    - "apps/agent/check_resolution.py"
    - "apps/agent/check_resolution_save.py"
    - "apps/agent/combat_grapple.py"
    - "apps/agent/combat_init_validation.py"
    - "apps/agent/combat_spatial.py"
    - "apps/agent/condition_bonus.py"
    - "apps/agent/condition_sources.py"
    - "apps/agent/condition_voice_rules.py"
    - "apps/agent/conditions.py"
    - "apps/agent/creature_schema.py"
    - "apps/agent/creature_tiers.py"
    - "apps/agent/dice.py"
    - "apps/agent/dramatic.py"
    - "apps/agent/encounter_actions.py"
    - "apps/agent/encounter_references.py"
    - "apps/agent/reaction_windows.py"
    - "apps/agent/region_types.py"
    - "apps/agent/role_archetypes.py"
    - "apps/agent/rules_engine.py"
    - "apps/agent/social_resolution.py"
    - "apps/agent/spell_voice_rules.py"
    - "apps/agent/terrain.py"
    - "apps/agent/world_effect_targets.py"
    - "apps/agent/world_regions.py"
    - "scripts/seed_content.py"
tasks:
  bun-scripts:
    run: "bun --env-file=.env test ./scripts"
    sets:
      - "commit"
    links:
      - "node_modules"
      - ".env"
    env:
      - "DATABASE_URL"
      - "REDIS_URL"
    inputs:
      - "$bun-config"
      - "scripts/tsconfig.json"
      - imports-of: "scripts/test_content.test.ts"
      - "$seeded-data"
      - imports-of: "apps/mobile/test-preload.ts"
  bun-shared:
    run: "bun test --cwd packages/shared"
    sets:
      - "commit"
    links:
      - "node_modules"
      - ".env"
    inputs:
      - "$bun-config"
      - "packages/shared/package.json"
      - "packages/shared/tsconfig.json"
      - imports-of: "packages/shared/src/entities/ability.test.ts"
      - imports-of: "packages/shared/src/entities/archetype.test.ts"
      - imports-of: "packages/shared/src/entities/companion.test.ts"
      - imports-of: "packages/shared/src/entities/creature.test.ts"
      - imports-of: "packages/shared/src/entities/encounter-references.test.ts"
      - imports-of: "packages/shared/src/entities/encounter.test.ts"
      - imports-of: "packages/shared/src/entities/item.test.ts"
      - imports-of: "packages/shared/src/entities/location.test.ts"
      - imports-of: "packages/shared/src/entities/npc.test.ts"
      - imports-of: "packages/shared/src/entities/recipe.test.ts"
      - imports-of: "packages/shared/src/entities/role_archetype.test.ts"
      - imports-of: "packages/shared/src/entities/spell.test.ts"
      - imports-of: "packages/shared/src/entities/terrain.test.ts"
      - "content/{companions,npcs,role_archetypes,locations,encounter_templates,creatures,loot_tables}.json"
      - "packages/shared/fixtures/**"
      - "assets/images/{companion,npc}_*.png"
      - "apps/agent/terrain.py"
      - "scripts/pyproject.toml"
      - "scripts/uv.lock"
      - "scripts/.python-version"
      - "apps/agent/region_types.py"
      - ".python-version"
  bun-design-tokens:
    run: "bun test --cwd packages/design-tokens"
    sets:
      - "commit"
    links:
      - "node_modules"
      - ".env"
    inputs:
      - "$bun-config"
      - "packages/design-tokens/package.json"
      - "packages/design-tokens/tsconfig.json"
      - imports-of: "packages/design-tokens/src/fonts.test.ts"
      - imports-of: "packages/design-tokens/src/index.test.ts"
  bun-server:
