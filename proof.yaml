tasks:
  bun-scripts:
      - $seeded-data

    run: >-
      bun --env-file=.env test ./scripts
    sets: [commit]
    links: [node_modules, .env]
    env: [DATABASE_URL, REDIS_URL]
    inputs:
      - $bun-config
      - imports-of: apps/mobile/test-preload.ts
      - scripts/tsconfig.json
      - imports-of: scripts/test_content.test.ts
      - 'content/*.json'
      - 'scripts/migrations/**'
      - 'scripts/seed*.py'
      - 'scripts/pyproject.toml'
      - 'scripts/uv.lock'
      - 'scripts/.python-version'
  bun-shared:
    run: >-
      bun test --cwd packages/shared
    sets: [commit]
    links: [node_modules, .env]
    inputs:
      - $bun-config
      - packages/shared/package.json
      - packages/shared/tsconfig.json
      - imports-of: packages/shared/src/entities/ability.test.ts
      - imports-of: packages/shared/src/entities/archetype.test.ts
      - imports-of: packages/shared/src/entities/companion.test.ts
      - imports-of: packages/shared/src/entities/creature.test.ts
      - imports-of: packages/shared/src/entities/encounter-references.test.ts
      - imports-of: packages/shared/src/entities/encounter.test.ts
      - imports-of: packages/shared/src/entities/item.test.ts
      - imports-of: packages/shared/src/entities/location.test.ts
      - imports-of: packages/shared/src/entities/npc.test.ts
      - imports-of: packages/shared/src/entities/recipe.test.ts
      - imports-of: packages/shared/src/entities/role_archetype.test.ts
      - imports-of: packages/shared/src/entities/spell.test.ts
      - imports-of: packages/shared/src/entities/terrain.test.ts
      - 'content/{companions,npcs,role_archetypes,locations,encounter_templates,creatures,loot_tables}.json'
      - 'packages/shared/fixtures/**'
      - 'assets/images/{companion,npc}_*.png'
      - 'apps/agent/terrain.py'
      - 'apps/agent/region_types.py'
      - '.python-version'
      - 'scripts/pyproject.toml'
      - 'scripts/uv.lock'
      - 'scripts/.python-version'
  bun-design-tokens:
    run: >-
      bun test --cwd packages/design-tokens
    sets: [commit]
    links: [node_modules, .env]
    inputs:
      - $bun-config
      - packages/design-tokens/package.json
      - packages/design-tokens/tsconfig.json
      - imports-of: packages/design-tokens/src/fonts.test.ts
      - imports-of: packages/design-tokens/src/index.test.ts
  bun-server:
    run: >-
      bun --env-file=../../.env test --cwd apps/server --path-ignore-patterns='**/{db,terrain-startup.integration,locations-load.integration,invite-store}.test.ts'
    sets: [commit]
    links: [node_modules, .env]
    inputs:
      - $bun-config
      - apps/server/package.json
      - apps/server/tsconfig.json
      - apps/server/bunfig.toml
