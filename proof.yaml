{
  "version": 1,
  "project": "divineruin",
  "delivered": [
    "**"
  ],
  "super-only": ["scripts/proof-coverage-map.json"],
  "coverage": [
    "{scripts,packages/shared,packages/design-tokens,apps/server,apps/mobile,apps/web}/**/*.test.{ts,tsx}",
    "apps/agent/tests/**/test_*.py",
    "e2e/specs/*.e2e.ts"
  ],
  "inputs": {
    "bun-test-files": [
      "**/*{.test,.spec,_test,_spec}.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
    ],
    "bun-config": [
      "bun.lock",
      "package.json",
      "bunfig.toml",
      "tsconfig.json"
    ],
    "seeded-data": [
      "content/*.json",
      "scripts/migrations/**",
      "scripts/pyproject.toml",
      "scripts/uv.lock",
      ".python-version",
      "scripts/.python-version",
      "apps/agent/_gods_content.py",
      "apps/agent/action_contracts.py",
      "apps/agent/action_contracts_still.py",
      "apps/agent/archetypes.py",
      "apps/agent/catalog_parse.py",
      "apps/agent/check_resolution.py",
      "apps/agent/check_resolution_save.py",
      "apps/agent/combat_damage_affinity.py",
      "apps/agent/combat_grapple.py",
      "apps/agent/combat_init_validation.py",
      "apps/agent/combat_movement_cost.py",
      "apps/agent/combat_spatial.py",
      "apps/agent/condition_bonus.py",
      "apps/agent/condition_catalog.py",
      "apps/agent/condition_restrictions.py",
      "apps/agent/condition_sources.py",
      "apps/agent/condition_voice_rules.py",
      "apps/agent/conditions.py",
      "apps/agent/creature_schema.py",
      "apps/agent/creature_turn_traits.py",
      "apps/agent/creature_tiers.py",
      "apps/agent/dice.py",
      "apps/agent/dramatic.py",
      "apps/agent/encounter_actions.py",
      "apps/agent/encounter_references.py",
      "apps/agent/patron_favor.py",
      "apps/agent/patron_gifts.py",
      "apps/agent/patron_passives.py",
      "apps/agent/patron_synergy.py",
      "apps/agent/reaction_windows.py",
      "apps/agent/region_types.py",
      "apps/agent/role_archetypes.py",
      "apps/agent/rules_engine.py",
      "apps/agent/social_resolution.py",
      "apps/agent/spell_voice_rules.py",
      "apps/agent/temp_hp.py",
      "apps/agent/terrain.py",
      "apps/agent/thyra_seasons.py",
      "apps/agent/weapon_proficiency.py",
      "apps/agent/world_effect_targets.py",
      "apps/agent/world_regions.py",
      "apps/agent/world_season.py",
      "scripts/seed_content.py"
    ],
    "stack-shared": [
      "apps/agent/tests/acceptance/_livekit.py",
      "apps/agent/tests/acceptance/_postgres_fixtures.py",
      "apps/agent/tests/_db_lifecycle.py",
      "scripts/seed_content.py"
    ],
    "stack": [
      "$stack-shared",
      "scripts/proof-acceptance-stack.sh",
      "scripts/proof_acceptance_stack.py",
      "scripts/worktree-common.sh",
      "scripts/worktree-docker.sh",
      "docker-compose.yml",
      "apps/agent/pyproject.toml",
      "apps/agent/uv.lock",
      "apps/agent/.python-version",
      "content/*.json",
      "scripts/migrations/**",
      "scripts/pyproject.toml",
      "scripts/uv.lock",
      ".python-version",
      "scripts/.python-version"
    ],
    "e2e-home-character-represents": [
      "packages/shared/**"
    ],
    "documentation-exclusions": [
      "!docs/**",
      "!**/*.md",
      "!CHANGELOG.md"
    ],
    "unit-stack": [
      "$stack",
      "$seeded-data",
      "scripts/**/*.py"
    ]
  },
  "generate": {
    "run": "python3 scripts/generate-proof-declarations.py",
    "inputs": [
      "scripts/generate-proof-declarations.py",
      "scripts/proof-coverage-map.json",
      "scripts/proof-python-closure.ts",
      "scripts/proof-bun-tasks.json",
      "scripts/proof-bun-ownership.ts",
      "$bun-test-files",
      "proof.yaml",
      "apps/agent/**/*.py",
      "scripts/**/*.py",
      "package.json",
      "bun.lock",
      "e2e/specs/*.e2e.ts",
      "scripts/proof-families.json",
      "content/*.json",
      "e2e/fixtures/inventory-snapshot.py",
      "apps/agent/tests/acceptance/**/*.feature",
      "apps/agent/tests/fixtures/**",
      "apps/agent/tests/acceptance/fixtures/**",
      "packages/shared/fixtures/**",
      "packages/shared/**/*.{ts,tsx,json}",
      "scripts/worktree-common.sh",
      "scripts/ensure-db.ts",
      "scripts/proof_runtime_inputs.py",
      "scripts/proof-launch-calls.json",
      "scripts/worktree-docker.sh",
      "apps/mobile/assets/sounds/**",
      "assets/images/**",
      "assets/audio/**",
      {
        "imports-of": "apps/mobile/scripts/emit-audio-registry-keys.ts"
      },
      {
        "imports-of": "apps/mobile/src/__tests__/sound-registry.test.ts"
      },
      {
        "imports-of": "apps/mobile/src/__tests__/use-game-events.parse.test.ts"
      },
      {
        "imports-of": "apps/mobile/test-preload.ts"
      },
      {
        "imports-of": "apps/server/src/index.ts"
      },
      {
        "imports-of": "apps/server/src/session-room-process.fixture.ts"
      },
      {
        "imports-of": "packages/shared/src/entities/encounter.ts"
      },
      {
        "imports-of": "scripts/migrate.ts"
      },
      {
        "imports-of": "scripts/seed_catalogs.ts"
      },
      {
        "imports-of": "scripts/seed_cache.ts"
      }
    ],
    "links": [
      "node_modules"
    ]
  },
  "providers": {
    "agent-db": {
      "start": "bash scripts/proof-acceptance-stack.sh dev-start",
      "stop": "bash scripts/proof-acceptance-stack.sh dev-stop"
    },
    "acceptance-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh start",
      "stop": "bash scripts/proof-acceptance-stack.sh stop"
    },
    "bun-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh bun-start",
      "stop": "bash scripts/proof-acceptance-stack.sh bun-stop"
    },
    "native-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh native-start",
      "stop": "bash scripts/proof-acceptance-stack.sh native-stop"
    },
    "e2e-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh e2e-start",
      "stop": "bash scripts/proof-acceptance-stack.sh e2e-stop"
    }
  },
  "lanes": {
    "e2e": 1
  },
  "unkeyed": [
    "packages/shared/**/*.{ts,tsx,json}"
  ]
}
