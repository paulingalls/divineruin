{
  "version": 1,
  "project": "divineruin",
  "delivered": [
    "**"
  ],
  "coverage": [
    "{scripts,packages/shared,packages/design-tokens,apps/server,apps/mobile,apps/web}/**/*.test.{ts,tsx}",
    "apps/agent/tests/**/test_*.py",
    "e2e/specs/*.e2e.ts"
  ],
  "inputs": {
    "bun-config": [
      "bun.lock",
      "package.json",
      "bunfig.toml",
      "tsconfig.json"
    ],
    "seeded-data": [
      "content/*.json",
      "scripts/migrations/**",
      "scripts/pyproject.toml",
      "scripts/uv.lock",
      ".python-version",
      "scripts/.python-version",
      "apps/agent/_gods_content.py",
      "apps/agent/action_contracts.py",
      "apps/agent/archetypes.py",
      "apps/agent/catalog_parse.py",
      "apps/agent/check_resolution.py",
      "apps/agent/check_resolution_save.py",
      "apps/agent/combat_grapple.py",
      "apps/agent/combat_init_validation.py",
      "apps/agent/combat_spatial.py",
      "apps/agent/condition_bonus.py",
      "apps/agent/condition_sources.py",
      "apps/agent/condition_voice_rules.py",
      "apps/agent/conditions.py",
      "apps/agent/creature_schema.py",
      "apps/agent/creature_tiers.py",
      "apps/agent/dice.py",
      "apps/agent/dramatic.py",
      "apps/agent/encounter_actions.py",
      "apps/agent/encounter_references.py",
      "apps/agent/patron_gifts.py",
      "apps/agent/reaction_windows.py",
      "apps/agent/region_types.py",
      "apps/agent/role_archetypes.py",
      "apps/agent/rules_engine.py",
      "apps/agent/social_resolution.py",
      "apps/agent/spell_voice_rules.py",
      "apps/agent/terrain.py",
      "apps/agent/world_effect_targets.py",
      "apps/agent/world_regions.py",
      "scripts/seed_content.py"
    ],
    "stack-shared": [
      "apps/agent/tests/acceptance/_livekit.py",
      "apps/agent/tests/acceptance/_postgres_fixtures.py",
      "apps/agent/tests/_db_lifecycle.py",
      "scripts/seed_content.py"
    ],
    "stack": [
      "$seeded-data",
      "$stack-shared",
      "scripts/proof-acceptance-stack.sh",
      "scripts/proof_acceptance_stack.py",
      "scripts/worktree-common.sh",
      "docker-compose.yml",
      "apps/agent/pyproject.toml",
      "apps/agent/uv.lock",
      "apps/agent/.python-version",
      "scripts/**/*.py"
    ],
    "e2e-home-character-represents": [
      "packages/shared/**"
    ]
  },
  "generate": {
    "run": "python3 scripts/generate-proof-declarations.py",
    "inputs": [
      "scripts/generate-proof-declarations.py",
      "scripts/proof-python-closure.ts",
      "scripts/proof-bun-tasks.json",
      "proof.yaml",
      "apps/agent/**/*.py",
      "scripts/**/*.py",
      "package.json",
      "bun.lock",
      "e2e/specs/*.e2e.ts"
    ],
    "links": [
      "node_modules"
    ]
  },
  "providers": {
    "agent-db": {
      "start": "bash scripts/proof-acceptance-stack.sh dev-start",
      "stop": "bash scripts/proof-acceptance-stack.sh dev-stop"
    },
    "acceptance-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh start",
      "stop": "bash scripts/proof-acceptance-stack.sh stop"
    },
    "bun-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh bun-start",
      "stop": "bash scripts/proof-acceptance-stack.sh bun-stop"
    },
    "e2e-stack": {
      "start": "bash scripts/proof-acceptance-stack.sh e2e-start",
      "stop": "bash scripts/proof-acceptance-stack.sh e2e-stop"
    }
  },
  "lanes": {
    "e2e": 1
  },
  "unkeyed": [
    "packages/shared/**"
  ]
}
